<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奈瓦 · 状态对战</title>
<style>
  :root{
    --bg:#0a0d13;
    --panel:#151b26;
    --panel-2:#1b2331;
    --line:#2a3446;
    --text:#e8edf7;
    --muted:#8b97ad;
    --attack:#ff6b57;
    --defend:#4aa8ff;
    --charge:#ffcc4d;
    --hp:#43d17c;
    --hp-low:#ff5c5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2740 0%, transparent 60%),
      radial-gradient(900px 500px at 85% 110%, #2a1b30 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;
    justify-content:center;
    padding:20px 16px 32px;
  }
  .app{width:min(980px,100%);display:flex;flex-direction:column;gap:18px}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand h1{margin:0;font-size:22px;letter-spacing:.08em}
  .brand small{color:var(--muted);font-size:12px;letter-spacing:.18em}
  .round-pill{
    padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:linear-gradient(180deg,#1d2534,#141a24);
    color:var(--muted);font-size:13px;letter-spacing:.06em;white-space:nowrap
  }
  .round-pill b{color:var(--text);font-size:15px}

  /* ---------- 战场 ---------- */
  .arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
  .fighter{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:14px 12px 16px;border-radius:20px;border:1px solid var(--line);
    background:linear-gradient(180deg,#161d29,#111722);
    transition:box-shadow .25s ease, border-color .25s ease, transform .12s ease;
    overflow:hidden;
  }
  .fighter::after{
    content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
    opacity:0;transition:opacity .25s ease;
    box-shadow:inset 0 0 60px rgba(74,168,255,.25);
  }
  .fighter.defending{border-color:rgba(74,168,255,.65)}
  .fighter.defending::after{opacity:1}
  .fighter.charging{border-color:rgba(255,204,77,.7)}
  .fighter.charging::after{opacity:1;box-shadow:inset 0 0 70px rgba(255,204,77,.3)}
  .fighter.hit{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)}
    40%,60%{transform:translateX(6px)}
  }

  .name{font-size:14px;letter-spacing:.14em;color:var(--muted)}
  .name b{color:var(--text);letter-spacing:.1em}

  .sprite-wrap{position:relative;width:100%;display:flex;justify-content:center;height:260px}
  .sprite-wrap::after{
    content:"";position:absolute;left:50%;top:46%;width:80%;height:80%;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(120,150,200,.14) 0%,rgba(120,150,200,0) 65%);
    pointer-events:none;
  }
  .sprite-wrap::before{
    content:"";position:absolute;left:50%;bottom:2px;width:72%;height:18px;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 70%);
    filter:blur(2px);pointer-events:none;
  }
  .sprite{position:relative;z-index:1;height:100%;max-width:100%;object-fit:contain;
    filter:drop-shadow(0 18px 26px rgba(0,0,0,.55));
    transition:transform .25s ease, filter .25s ease;
  }
  .player .sprite{transform:scaleX(-1)}
  .fighter.charging .sprite{filter:drop-shadow(0 0 24px rgba(255,204,77,.55)) drop-shadow(0 18px 26px rgba(0,0,0,.5))}
  .fighter.defending .sprite{filter:drop-shadow(0 0 22px rgba(74,168,255,.5)) drop-shadow(0 18px 26px rgba(0,0,0,.5))}

  .shield{
    position:absolute;inset:6% 12%;border-radius:50%;
    border:2px solid rgba(74,168,255,.75);
    box-shadow:0 0 24px rgba(74,168,255,.45), inset 0 0 30px rgba(74,168,255,.2);
    opacity:0;transform:scale(.85);transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .fighter.defending .shield{opacity:1;transform:scale(1)}

  .hp{width:100%;display:flex;align-items:center;gap:8px}
  .hp-track{position:relative;flex:1;height:12px;border-radius:999px;background:#0b1018;border:1px solid var(--line);overflow:hidden}
  .hp-fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#2fbf6b,#7ef0a8);transition:width .45s ease, background .45s ease}
  .hp-fill.low{background:linear-gradient(90deg,#d63c3c,#ff8a6b)}
  .hp-num{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:52px;text-align:right}
  .hp-num b{color:var(--text);font-size:15px}

  .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px}
  .badge{
    font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:#0f1520;letter-spacing:.06em
  }
  .badge.on{color:#0a0d13;border-color:transparent;font-weight:600}
  .badge.state-attack.on{background:var(--attack)}
  .badge.state-defend.on{background:var(--defend)}
  .badge.state-charge.on{background:var(--charge)}
  .badge.state-hurt.on{background:#ff8a6b}
  .badge.state-normal.on{background:#33405a;color:var(--text)}
  .badge.buff{color:var(--charge);border-color:rgba(255,204,77,.5);background:rgba(255,204,77,.1)}
  .hidden{display:none !important}

  .vs{
    align-self:center;font-size:15px;font-weight:800;letter-spacing:.14em;color:#5a6a85;
    padding:0 2px;opacity:.85
  }

  /* ---------- 结果 ---------- */
  .verdict{
    min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:12px 16px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,#151c28,#101620);
    font-size:15px;line-height:1.5;color:var(--text);
  }
  .verdict .dmg{font-weight:700;font-variant-numeric:tabular-nums}
  .verdict .p{color:#ff8a6b}
  .verdict .a{color:#ffb36b}

  /* ---------- 按钮 ---------- */
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:16px 10px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,#1b2433,#131a26);
    color:var(--text);font-size:16px;font-weight:600;letter-spacing:.1em;
    cursor:pointer;user-select:none;
    transition:transform .08s ease, border-color .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn .ico{font-size:20px;line-height:1}
  .btn:hover{border-color:#3b4a63}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.attack:hover{box-shadow:0 0 0 1px rgba(255,107,87,.5),0 10px 26px -12px rgba(255,107,87,.8);border-color:rgba(255,107,87,.6)}
  .btn.defend:hover{box-shadow:0 0 0 1px rgba(74,168,255,.5),0 10px 26px -12px rgba(74,168,255,.8);border-color:rgba(74,168,255,.6)}
  .btn.charge:hover{box-shadow:0 0 0 1px rgba(255,204,77,.5),0 10px 26px -12px rgba(255,204,77,.8);border-color:rgba(255,204,77,.6)}
  .hint{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.04em}

  /* ---------- 规则 ---------- */
  details.rules{border:1px solid var(--line);border-radius:14px;background:#0f1520;padding:0 14px}
  details.rules summary{cursor:pointer;padding:12px 0;color:var(--muted);font-size:13px;letter-spacing:.08em;list-style:none}
  details.rules summary::-webkit-details-marker{display:none}
  details.rules table{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:13px}
  details.rules th,details.rules td{border:1px solid var(--line);padding:7px 9px;text-align:center;color:var(--muted)}
  details.rules th{color:var(--text);background:#141b27;font-weight:600}
  details.rules td b{color:var(--text)}
  details.rules p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.7}

  /* ---------- 浮动伤害 ---------- */
  .float{
    position:absolute;left:50%;top:38%;transform:translate(-50%,0);
    font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
    color:#ff8a6b;text-shadow:0 2px 12px rgba(0,0,0,.8);
    animation:floatUp 1s ease-out forwards;pointer-events:none;z-index:3
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,10px) scale(.8)}
    20%{opacity:1;transform:translate(-50%,-6px) scale(1.05)}
    100%{opacity:0;transform:translate(-50%,-64px) scale(1)}
  }

  /* ---------- 结束遮罩 ---------- */
  .overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,8,13,.78);backdrop-filter:blur(6px);z-index:20;padding:20px
  }
  .overlay .card{
    width:min(420px,100%);text-align:center;padding:28px 24px 24px;border-radius:22px;
    border:1px solid var(--line);background:linear-gradient(180deg,#1a2231,#101620);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9)
  }
  .overlay h2{margin:0 0 6px;font-size:26px;letter-spacing:.1em}
  .overlay p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6}
  .overlay button{
    width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,204,77,.6);
    background:linear-gradient(180deg,#2a2415,#1b1810);color:var(--charge);
    font-size:15px;font-weight:700;letter-spacing:.12em;cursor:pointer
  }
  .overlay button:hover{box-shadow:0 0 0 1px rgba(255,204,77,.5),0 12px 30px -14px rgba(255,204,77,.8)}

  @media (max-width:720px){
    body{padding:14px 10px 24px}
    .arena{grid-template-columns:1fr 1fr;gap:8px}
    .vs{display:none}
    .fighter{padding:10px 8px 12px}
    .sprite-wrap{height:min(30vh,190px)}
    .brand h1{font-size:18px}
    .controls{gap:8px}
    .btn{padding:14px 6px;font-size:14px;letter-spacing:.06em}
    .btn .ico{font-size:18px}
    .overlay h2{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>

  };
  const MAX_HP = 100;
  const BASE_DAMAGE = 12;
  const BUFF_MULTIPLIER = 1.5;
  const ACTIONS = ["attack", "defend", "charge"];
  const LABEL = { attack: "攻击", defend: "防御", charge: "蓄力", normal: "常态", hurt: "受伤" };

  const el = id => document.getElementById(id);
  const playerCard = el("playerCard"), aiCard = el("aiCard");
  const playerImg = el("playerImg"), aiImg = el("aiImg");
  const playerHpBar = el("playerHpBar"), aiHpBar = el("aiHpBar");
  const playerHpText = el("playerHp"), aiHpText = el("aiHp");
  const playerState = el("playerState"), aiState = el("aiState");
  const playerBuff = el("playerBuff"), aiBuff = el("aiBuff");
  const verdict = el("verdict");
  const roundNum = el("roundNum");
  const buttons = Array.from(document.querySelectorAll(".btn"));
  const overlay = el("overlay");
  const overlayTitle = el("overlayTitle");
  const overlayText = el("overlayText");
  const restartBtn = el("restart");

  const state = {
    playerHp: MAX_HP, aiHp: MAX_HP, round: 1,
    playerBuff: false, aiBuff: false,
    busy: false, over: false
  };

  function damageOf(hasBuff){ return hasBuff ? Math.round(BASE_DAMAGE * BUFF_MULTIPLIER) : BASE_DAMAGE; }

  function resolve(playerAction, aiAction){
    const pBuff = state.playerBuff, aBuff = state.aiBuff;
    let playerDamage = 0, aiDamage = 0;
    let playerGainBuff = false, aiGainBuff = false;
    let playerConsumed = false, aiConsumed = false;
    let text = "";

    if (playerAction === "attack" && aiAction === "attack") {
      aiDamage = damageOf(pBuff);
      playerDamage = damageOf(aBuff);
      playerConsumed = pBuff; aiConsumed = aBuff;
      text = `双方同时出手，<b>两败俱伤</b>！你受到 <span class="dmg p">${playerDamage}</span>，电脑受到 <span class="dmg a">${aiDamage}</span>。`;
    } else if (playerAction === "attack" && aiAction === "defend") {
      playerConsumed = pBuff;
      text = "电脑举起防御，你的攻击被<b>完全挡下</b>。";
    } else if (playerAction === "attack" && aiAction === "charge") {
      aiDamage = damageOf(pBuff);
      playerConsumed = pBuff;
      text = `你打断了电脑的蓄力，造成 <span class="dmg a">${aiDamage}</span> 点伤害。`;
    } else if (playerAction === "defend" && aiAction === "attack") {
      aiConsumed = aBuff;
      text = "你成功防御，电脑的攻击<b>没有造成伤害</b>。";
    } else if (playerAction === "defend" && aiAction === "defend") {
      text = "双方都在防御，这一回合风平浪静。";
    } else if (playerAction === "defend" && aiAction === "charge") {
      aiGainBuff = true;
      text = "电脑完成蓄力，下一次攻击伤害 <b>+50%</b>。";
    } else if (playerAction === "charge" && aiAction === "attack") {
      playerDamage = damageOf(aBuff);
      aiConsumed = aBuff;
      text = `电脑打断了你的蓄力，你受到 <span class="dmg p">${playerDamage}</span> 点伤害。`;
    } else if (playerAction === "charge" && aiAction === "defend") {
      playerGainBuff = true;
      text = "电脑在防御，你顺利完成蓄力，下一次攻击 <b>+50%</b>。";
    } else {
      playerGainBuff = true; aiGainBuff = true;
      text = "双方同时蓄力，下一次攻击都会更疼。";
    }

    return { playerDamage, aiDamage, playerGainBuff, aiGainBuff, playerConsumed, aiConsumed, text };
  }

  function damageText(n){ return n > 0 ? `-${n}` : ""; }

  function floatDamage(layer, n, cls){
    if (!n) return;
    const node = document.createElement("div");
    node.className = "float " + (cls || "");
    node.textContent = "-" + n;
    layer.appendChild(node);
    setTimeout(() => node.remove(), 1000);
  }

  function setSprite(img, kind){
    const src = IMG[kind] || IMG.normal;
    if (img.getAttribute("src") !== src) img.setAttribute("src", src);
  }

  function paintHp(bar, textEl, hp){
    const ratio = Math.max(0, Math.min(1, hp / MAX_HP));
    bar.style.width = (ratio * 100) + "%";
    bar.classList.toggle("low", ratio <= 0.3);
    textEl.textContent = String(Math.max(0, hp));
  }

  function setStateBadge(node, kind){
    node.className = "badge state-" + kind + " on";
    node.textContent = LABEL[kind];
  }

  function setBuffBadge(node, has){
    node.classList.toggle("hidden", !has);
  }

  function refresh(){
    paintHp(playerHpBar, playerHpText, state.playerHp);
    paintHp(aiHpBar, aiHpText, state.aiHp);
    setBuffBadge(playerBuff, state.playerBuff);
    setBuffBadge(aiBuff, state.aiBuff);
    roundNum.textContent = String(state.round);
  }

  function visual(kind, card, img){
    card.classList.remove("defending", "charging", "hit");
    if (kind === "defend") card.classList.add("defending");
    if (kind === "charge") card.classList.add("charging");
    setSprite(img, kind);
  }

  function lock(locked){
    state.busy = locked;
    buttons.forEach(b => { b.disabled = locked; });
  }

  function finish(){
    state.over = true;
    const playerLost = state.playerHp <= 0;
    const aiLost = state.aiHp <= 0;
    let title, text;
    if (playerLost && aiLost) { title = "同归于尽"; text = "双方同时倒下，平局。"; }
    else if (aiLost) { title = "胜利"; text = `你在第 ${state.round} 回合击败了电脑。`; }
    else { title = "失败"; text = `电脑在第 ${state.round} 回合击败了你。`; }
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.classList.remove("hidden");
    lock(true);
  }

  function play(playerAction){
    if (state.busy || state.over) return;
    lock(true);
    const aiAction = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
    const r = resolve(playerAction, aiAction);

    // 先展示双方本回合的姿态
    visual(playerAction, playerCard, playerImg);
    visual(aiAction, aiCard, aiImg);
    setStateBadge(playerState, playerAction);
    setStateBadge(aiState, aiAction);

    state.playerHp -= r.playerDamage;
    state.aiHp -= r.aiDamage;
    if (r.playerGainBuff) state.playerBuff = true;
    if (r.aiGainBuff) state.aiBuff = true;
    if (r.playerConsumed) state.playerBuff = false;
    if (r.aiConsumed) state.aiBuff = false;

    verdict.innerHTML =
      `你：<b>${LABEL[playerAction]}</b> ｜ 电脑：<b>${LABEL[aiAction]}</b><br>${r.text}`;

    if (r.playerDamage) {
      playerCard.classList.add("hit");
      floatDamage(el("playerFloat"), r.playerDamage);
    }
    if (r.aiDamage) {
      aiCard.classList.add("hit");
      floatDamage(el("aiFloat"), r.aiDamage);
    }
    refresh();

    const damagedPlayer = r.playerDamage > 0;
    const damagedAi = r.aiDamage > 0;

    // 结算后 0.55s 把受伤状态显示出来
    setTimeout(() => {
      if (damagedPlayer) { visual("hurt", playerCard, playerImg); setStateBadge(playerState, "hurt"); }
      if (damagedAi) { visual("hurt", aiCard, aiImg); setStateBadge(aiState, "hurt"); }
    }, 520);

    setTimeout(() => {
      if (state.playerHp <= 0 || state.aiHp <= 0) { finish(); return; }
      state.round += 1;
      refresh();
      playerCard.classList.remove("defending", "charging", "hit");
      aiCard.classList.remove("defending", "charging", "hit");
      setSprite(playerImg, "normal"); setSprite(aiImg, "normal");
      setStateBadge(playerState, "normal"); setStateBadge(aiState, "normal");
      lock(false);
    }, 1150);
  }

  function restart(){
    state.playerHp = MAX_HP; state.aiHp = MAX_HP; state.round = 1;
    state.playerBuff = false; state.aiBuff = false; state.over = false;
    overlay.classList.add("hidden");
    playerCard.classList.remove("defending", "charging", "hit");
    aiCard.classList.remove("defending", "charging", "hit");
    setSprite(playerImg, "normal"); setSprite(aiImg, "normal");
    setStateBadge(playerState, "normal"); setStateBadge(aiState, "normal");
    verdict.textContent = "选择一个行动，电脑会随机出招。";
    refresh();
    lock(false);
  }

  buttons.forEach(btn => {
    btn.addEventListener("click", () => play(btn.dataset.action));
  });
  restartBtn.addEventListener("click", restart);

  document.addEventListener("keydown", ev => {
    if (state.busy || state.over) return;
    if (ev.key === "1") play("attack");
    else if (ev.key === "2") play("defend");
    else if (ev.key === "3") play("charge");
  });

  refresh();
})();
</script>
